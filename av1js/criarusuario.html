<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar Usuários</title>
</head>
<body>
<h1><center>Criar Usuários</center></h1>

<form id="formulario">
Nome: <input type="text" id="nome"><br>
CPF: <input type="text" id="cpf"><br>
<br><button type="button" onclick="criarUsuario()">Criar</button>
</form>

<h3 id="mensagem"></h3>
<br><a href="listarusuarios.html">Listar Usuários</a>
<br><a href="alterarusuario.html">Alterar Usuários</a>
<br><a href="excluirusuario.html">Excluir Usuários</a>
<br><a href="../criarperguntas.html">Voltar</a>

<script>
function criarUsuario()
{
let nome = document.getElementById("nome").value;
let cpf = document.getElementById("cpf").value;

let url = "../php/criarusuario.php?nome=" + encodeURIComponent(nome) + "&cpf=" + encodeURIComponent(cpf);

let xhr = new XMLHttpRequest();
xhr.onreadystatechange = function()
{
if(xhr.readyState == 4 && xhr.status == 200)
{
document.getElementById("mensagem").innerText = xhr.responseText;
document.getElementById("formulario").reset();
}
};
xhr.open("GET", url, true);
 xhr.send();
}
    </script>
</body>
</html>
