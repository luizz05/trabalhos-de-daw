<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Usuários</title>
</head>
<body>

<h1><center>Alterar Usuários</center></h1>

<form id="formulario">
CPF do usuário: <input type="text" id="cpf"><br>
Novo Nome: <input type="text" id="nome"><br>
<br>
<button type="button" onclick="alterarUsuario()">Alterar</button>
</form>

<h3 id="mensagem"></h3>

<script>

function alterarUsuario()
{
let cpf = document.getElementById("cpf").value;
let nome = document.getElementById("nome").value;

let url = "../php/alterarusuario.php?cpf=" + encodeURIComponent(cpf) + "&nome=" + encodeURIComponent(nome);

let xhr = new XMLHttpRequest();

xhr.onreadystatechange = function()
{
if(xhr.readyState == 4 && xhr.status == 200)
{
document.getElementById("mensagem").innerText = xhr.responseText;
document.getElementById("formulario").reset();
}
};

xhr.open("GET", url, true);
xhr.send();
}

</script>
<br><a href="criarusuario.html">Voltar</a>
</body>
</html>
