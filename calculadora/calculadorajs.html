<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora</title>
</head>
<body>
<h2 align="center">Calculadora</h2>
<form id="formulario">
n1:<input type="number" id="valor1"><br>

n2:<input type="number" id="valor2"><br>

operação:<select id="operacao">
<option value="+">+</option>
<option value="-">-</option>
<option value="*">*</option>
<option value="/">/</option>
</select>
<button type="button" onclick="calcular()">Enviar</button>
</form>
<h3 id="resposta"></h3>
<script>
function calcular() {
let valor1 = document.getElementById("valor1").value;
let valor2 = document.getElementById("valor2").value;
let operacao = document.getElementById("operacao").value;
let requisicao = new XMLHttpRequest();
requisicao.onreadystatechange = function() {
if (requisicao.readyState == 4 && requisicao.status == 200) {
document.getElementById("resposta").innerText =
"O resultado é: " + requisicao.responseText;
}
};
let endereco = "calculo.php?num1=" + valor1 +
"&num2=" + valor2 +
"&op=" + encodeURIComponent(operacao);
requisicao.open("GET", endereco, true);
requisicao.send();
}
</script>
</body>
</html>
