<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excluir Usuário</title>
</head>
<body>

<h1><center>Excluir Usuário</center></h1>

<form id="formulario">
CPF do usuario: <input type="text" id="cpf"><br>
<br><button type="button" onclick="excluirUsuario()">Excluir</button>
</form>

<h3 id="mensagem"></h3>

<script>
function excluirUsuario()
{
let cpf = document.getElementById("cpf").value;

let url = "../php/excluirusuario.php?cpf=" + encodeURIComponent(cpf);

let xhr = new XMLHttpRequest();

xhr.onreadystatechange = function()
{
if(xhr.readyState == 4 && xhr.status == 200)
{
document.getElementById("mensagem").innerText = xhr.responseText;
document.getElementById("formulario").reset();
}
};

xhr.open("GET", url, true);
xhr.send();
}
</script>

<br><a href="criarusuario.html">Voltar</a>

</body>
</html>
